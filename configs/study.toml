# harness-bench study configuration, round 1.
# 4 configurations x the main ResearchRubrics questions in configs/splits.json x 1 run,
# plus smoke questions that are never scored.
# The sha256 of this file is stamped on every manifest, run and result. Changing it after a
# manifest is frozen makes `hb verify` fail; later changes go in amendments/.

[model]
id = "claude-fable-5-2"          # every outcome-affecting generative call; the gateway refuses anything else
effort = "high"                  # pinned in every arm and logged per call

[pricing.contestant]             # USD per 1M tokens, list price. Confirm against the live pricing page before spending.
input = 8.0
output = 40.0
cache_write = 10.0
cache_read = 0.20
[pricing.jev]
input = 0.042
output = 0.0

# ------------------------------------------------------------------ funding (cumulative ceilings; nothing here buys credits)
# There are no per-run dollar caps. Each provider has one cumulative ceiling for the round. A call is
# dispatched only if its worst-case charge still fits under what remains. How much is confirmed to be
# available at each provider is operational state kept in configs/funding.local.toml.
[funding.anthropic]
ceiling_usd = 310.0
[funding.jev]
ceiling_usd = 10.0
[funding.exa]
ceiling_usd = 45.0
[funding.enforcement]
bytes_per_token = 3.0            # conservative input estimate for the worst-case hold on a call in flight
reservation_wait_s = 600         # near the ceiling, a call waits this long for in-flight holds to settle before being refused

# ------------------------------------------------------------------ dataset (pinned, hash-checked)
[datasets.researchrubrics]
repo = "ScaleAI/researchrubrics"
revision = "85de3115053d1453ed612caacf4a405edc1ad756"
file = "processed_data.jsonl"
sha256 = "ea2023d03953b70ba4a2f7f1fe490b434f18cec26c4fdb48acc0e3edf3d8edfb"

[sampling]                       # the selection itself is frozen in configs/splits.json (task ids only)
seed = "harness-bench-2026-11"
main = 15
smoke = 2
excluded = []                    # never "closed-book solved it"

# ------------------------------------------------------------------ safeguards (not budgets)
# These exist only to stop a hung process or a runaway loop. They sit far above the use seen in smoke
# runs. A run they interrupt is labelled "safeguard_interrupted" with the reason and is disclosed.
[safeguards]
max_wall_seconds = 14400         # 4 hours end to end; the longest smoke run took 13 minutes
max_llm_calls = 3000
max_tool_calls = 5000
max_consecutive_llm_errors = 30  # e.g. a harness retrying a rejected request forever

[execution]
llm_request_timeout_s = 900
sdk_max_retries = 2
infra_retries = 0                # no automatic re-run: with uncapped runs a repeat is an operator decision, made under a new campaign name
kill_grace_s = 60

[tools]
backend = "exa"                  # one backend for B, C and D. No fallback backend.
search_type = "auto"             # Exa retrieval. The synthesising modes (deep*) are not used.
search_max_results = 5
snippet_chars = 500              # raw page text. Exa highlights and summaries are model-generated and are not requested.
fetch_max_chars = 30000          # the shared page reader's output size, identical for every research arm; cut with a visible marker
timeout_s = 60
search_reserve_usd = 0.015       # held against the Exa ceiling while a call is in flight; settled to Exa's reported cost
fetch_reserve_usd = 0.002
blocked_domains = []
blocked_url_substrings = ["researchrubrics", "2511.07685", "RuVerBench", "research.site"]

[trace]
store_bodies = true

# ------------------------------------------------------------------ contestants
[systems.closed_book]            # A
kind = "closed_book"
effort = "high"
max_tokens = 64000               # generous single-answer allowance; thinking and answer share it

[systems.plain_tools]            # B
kind = "plain_tools"
effort = "high"
max_tokens = 64000               # per call
compaction = false

[systems.gpt_researcher]         # C, modified configuration (see docs/COHORT.md)
kind = "subprocess"
command = "{root}/adapters/.venv-gptr/bin/python {root}/adapters/gptr_driver.py"
shims = ["pin_effort"]
[systems.gpt_researcher.env]
RETRIEVER_ARG_TOKEN = "{token}"
FAST_LLM = "anthropic:{model}"
SMART_LLM = "anthropic:{model}"
STRATEGIC_LLM = "anthropic:{model}"
CONTEXT_FILTER = "keyword"       # explicit; "auto" would enable Jev whenever TYPESAFE_API_KEY is present
RETRIEVER = "custom"
RETRIEVER_ENDPOINT = "{gateway}/tools/gptr"
REPORT_SOURCE = "web"
DEEP_RESEARCH_BREADTH = "3"      # harness defaults, kept
DEEP_RESEARCH_DEPTH = "2"
DEEP_RESEARCH_CONCURRENCY = "4"
FAST_TOKEN_LIMIT = "16000"       # thinking shares max_tokens, so the stock 4000 would truncate
STRATEGIC_TOKEN_LIMIT = "16000"
SMART_TOKEN_LIMIT = "20000"      # non-streaming calls: the Anthropic SDK refuses larger allowances without streaming
SUMMARY_TOKEN_LIMIT = "8000"

[systems.deepagents]             # D, modified configuration
kind = "subprocess"
command = "{root}/adapters/.venv-deepagents/bin/python {root}/adapters/deepagents_driver.py"
shims = ["pin_effort"]
[systems.deepagents.env]
HB_DEEPAGENTS_EXAMPLE = "{root}/adapters/vendor/deepagents/examples/deep_research"
HB_MAX_TOKENS = "20000"          # non-streaming calls: the Anthropic SDK refuses larger allowances without streaming

# ------------------------------------------------------------------ judges (evaluator process only)
[judges.jev]
model = "jev-1.14.0"             # versioned id, never an alias
max_attempts = 3
sdk_max_retries = 3
timeout_s = 60
concurrency = 6
allow_long_context = true        # used only after an explicit context-limit error; recorded per judgment
reserve_usd = 0.004              # held against the Jev ceiling while a call is in flight
[judges.jev.params]
question_type = "choice"

[judges.astra]                   # GPT-6 Astra through the official Codex CLI on a signed-in account
transport = "codex_cli"
model = "gpt-6-astra"
cli_version = "codex-cli 0.162.1"
mode = "batch"                   # one fresh session per report, all its criteria. Fixed for every system after the development check.
max_attempts = 2
timeout_s = 1200
concurrency = 2
[judges.astra.params]
reasoning_effort = "medium"

[validation]                     # small fixed grader check on RuVerBench ResearchRubrics records (other systems' reports)
seed = "validation-2026-11"
dev_reports = 10
heldout_reports = 30

[review]
seed = "review-2026-11"
max_disagreements = 40
agreement_sample = 20
heavy_weight = 4                 # |weight| 4-5 is "mandatory" in the ResearchRubrics paper

[analysis]
closed_book = "closed_book"
plain = "plain_tools"
n_boot = 10000
boot_seed = 20261109
primary_pairs = [["closed_book", "plain_tools"], ["plain_tools", "gpt_researcher"], ["plain_tools", "deepagents"]]

[freeze]
require_clean_tagged_commit_for_main = true   # main runs refuse to start from an uncommitted or untagged tree
tag_prefix = "freeze-"
